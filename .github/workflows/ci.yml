name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the run already in flight. Without
# this, a busy branch queues builds nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API - build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          # Keyed on the hash of every pom in the repo, so the cache is
          # invalidated when dependencies change and only then.
          cache: maven

      - name: Test
        working-directory: api
        # Testcontainers starts a real PostgreSQL via the Docker daemon that
        # ubuntu-latest already provides. No service container needed, and the
        # suite runs identically here and on a laptop.
        run: ./mvnw -B test

      - name: Package
        working-directory: api
        run: ./mvnw -B -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: stockroom-api-jar
          path: api/target/*.jar
          retention-days: 7

  web:
    name: Web - typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build
