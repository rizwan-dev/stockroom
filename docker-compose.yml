# One command brings up the database, the API and the web app:
#   docker compose up --build
#
# Host ports are deliberately unusual - 9192 for the API and 55432 for Postgres.
# Inside the compose network the containers still speak 8080 and 5432; only what
# is claimed on your machine changes, because 8080 and 5432 are the two ports
# most likely to be occupied already.
#
# The API waits for Postgres to be genuinely ready rather than merely started,
# and the web app waits for the API's readiness probe. Without that, the first
# run races and the UI loads against an API that is still migrating.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockroom
      POSTGRES_USER: stockroom
      POSTGRES_PASSWORD: stockroom
    ports:
      - "55432:5432"
    volumes:
      - stockroom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockroom -d stockroom"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DB_URL: jdbc:postgresql://db:5432/stockroom
      DB_USER: stockroom
      DB_PASSWORD: stockroom
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "9192:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      # What the browser uses...
      NEXT_PUBLIC_API_URL: http://localhost:9192
      # ...and what server-side rendering uses, on the compose network, where
      # localhost would mean this container rather than the API.
      API_INTERNAL_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  stockroom-data:
