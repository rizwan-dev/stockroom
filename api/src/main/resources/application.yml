spring:
  application:
    name: stockroom-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stockroom}
    username: ${DB_USER:stockroom}
    password: ${DB_PASSWORD:stockroom}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
